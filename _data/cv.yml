    - title: Distributed Transaction Server
      institution: "Advisor: Prof. Prashant Shenoy"
      description:
        - Built a fault-tolerant three-tier trading platform, keeping replicas consistent via Bully leader election and Paxos.
    - title: Flexible Polar Encoding for Information Reconciliation in QKD
      description:
        - Designed a polar-code encoder for error reconciliation in quantum key distribution (QKD), deriving an O(N log N) reliability-sequence algorithm that works with any decoder.
        - Converged ~47x faster than prior methods (~10 s vs. ~468 s at N = 2<sup>16</sup>) at comparable quality, with finite-key security proofs.

